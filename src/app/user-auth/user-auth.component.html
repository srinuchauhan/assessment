<div class="userAuth">
  <div class="sign-up" *ngIf="!showLogin">
    <h2>sign-up</h2>
    <form #userform="ngForm" (ngSubmit)="userSignUp(userform.value)" class="signup-form">
      <input
        placeholder="please enter your name "
        type="text"
        name="name"
        ngModel
      />
      <input
        placeholder="please enter your password"
        type="password"
        name="password"
        ngModel
      />
      <input
        placeholder="please enter your email "
        type="email"
        name="email"
        ngModel
      />
      <button class="signUp-button" >sign-up</button>
     <p>already have account? <a (click)="openuserSignUp()"> click to login</a></p>
    </form>
  </div>


<!-- user login for -->

<div class="sign-up" *ngIf="showLogin">
    <h2>Login</h2>
    <p class="authError">{{authError}}</p>
    <form #userform="ngForm" (ngSubmit)="userLogin(userform.value)"class="signup-form">
      <!-- <input
        placeholder="please enter your name "
        type="text"
        name="name"
        ngModel
      /> -->
      <input
        placeholder="please enter your email "
        type="email"
        name="emailid"
        ngModel
        #email="ngModel" required
      />
      <p class="invalid-input"><span *ngIf="email.invalid && email.touched">please enter a valid value</span></p>
      <input
        placeholder="please enter your password"
        type="password"
        name="password"
        ngModel
        #password="ngModel" required
        minlength="6"
        maxlength="15"
      />
      <p class="invalid-input"><span *ngIf="password.invalid && password.touched">please enter a valid value</span></p>
      <button  [disabled]="userform.invalid" class="Login-button" >Login</button>
     <p>don't have account? <a (click)="openuserLogin()"> click to signUp</a></p>
    </form>
  </div>
</div>
